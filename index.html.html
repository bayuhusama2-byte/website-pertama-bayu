
<!DOCTYPE html>
<html>
<head>
    <title>Website Pertama Bayu</title>

    <style>
        body {
            background-color: #eaf2ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 15px #00000020;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Halo, Zahwa Cantik!</h1>

        <h2>Selamat Datang</h2>

        <p>
            Ini adalah website pertamaku.
            Aku sedang belajar coding!
        </p>

        <button onclick="alert('Morning Cantik!')">
            Klik Aku
        </button>

    </div>

</body>
</html>
